reading:
- title: Moonbound
  author: Robin Sloan
  note: I have a hard time with sci-fi and fantasy but love Robin's writing. I found
    myself so easily pulled into that world and loved it.
- title: Dogs
  author: C. Mallon
  note: Gorgeous prose. Brutal brutal subject matter. Ripped me up and somehow really
    enjoyed the whole process.
