---
layout: default
title: Blog
---
<div class="section-header">
  <h1>Blog</h1>
</div>

<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url }}">{{ post.title }}</a>
    <time>{{ post.date | date: "%B %-d, %Y" }}</time>
  </li>
  {% endfor %}
</ul>

{% if site.posts.size == 0 %}
<p class="text-secondary">No posts yet.</p>
{% endif %}
