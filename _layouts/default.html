<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml">
</head>
<body>
  <nav class="nav">
    <a href="/" class="nav-name">{{ site.title }}</a>
    <div class="nav-links">
      <a href="/blog"{% if page.url == '/blog/' or page.url contains '/blog/' %} class="active"{% endif %}>Blog</a>
      <a href="/log"{% if page.url == '/log/' %} class="active"{% endif %}>Log</a>
      <a href="/writing"{% if page.url == '/writing/' %} class="active"{% endif %}>Writing</a>
      <a href="/photos"{% if page.url == '/photos/' %} class="active"{% endif %}>Photos</a>
      <a href="/about"{% if page.url == '/about/' %} class="active"{% endif %}>About</a>
    </div>
  </nav>

  <main class="main">
    {{ content }}
  </main>

  <footer class="footer">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.author }}</p>
  </footer>
</body>
</html>
